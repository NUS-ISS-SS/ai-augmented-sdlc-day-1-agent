<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="todo-title">
      <div class="card-header">
        <div class="card-header-text">
          <h1 id="todo-title">My Tasks</h1>
          <p class="task-stats" id="task-stats" aria-live="polite">No tasks yet</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" type="button">🌙</button>
      </div>

      <div class="progress-bar-wrap" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">Add a task</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="What needs to be done?"
          autocomplete="off"
        >
        <button type="submit" aria-label="Add task"><span aria-hidden="true">+</span> Add</button>
      </form>

      <div class="filter-bar" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="active" type="button">Active</button>
        <button class="filter-btn" data-filter="done" type="button">Done</button>
      </div>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
